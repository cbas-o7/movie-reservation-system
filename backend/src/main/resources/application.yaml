spring:
  application:
    name: reservation-system
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        # Expone solo las rutas de health e info
        include: "health,info"
  endpoint:
    health:
      # Muestra los detalles de health mientras no haya seguridad
      show-details: "always"