spring:
  application:
    name: reservation-system
  datasource:
    # Lee la variable de entorno, si no existe, usa lo que está después de los dos puntos (:)
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        # Expone solo las rutas de health e info
        include: "health,info"
  endpoint:
    health:
      # Muestra los detalles de health mientras no haya seguridad
      show-details: "always"